[project]
name = "options-scraper"
version = "0.1.0"
description = "Scrapes Discord for options flow"
requires-python = ">=3.11"
dependencies = [
  "discord.py-self",
  "finance-shared",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
finance-shared = { workspace = true }
