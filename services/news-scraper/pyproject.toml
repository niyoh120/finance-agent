[project]
name = "news-scraper"
version = "0.1.0"
description = "Scrapes financial news from BubbleSeek"
requires-python = ">=3.11"
dependencies = [
    "finance-shared",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "uvloop>=0.19.0",
]

[tool.uv.sources]
finance-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
