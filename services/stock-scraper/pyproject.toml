[project]
name = "stock-scraper"
version = "0.1.0"
description = "Polls Stock API and saves to DB"
requires-python = ">=3.11"
dependencies = [
    "finance-shared",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
]

[tool.uv.sources]
finance-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
