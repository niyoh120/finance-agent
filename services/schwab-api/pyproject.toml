[project]
name = "schwab-api"
version = "0.1.0"
description = "Standalone HTTP data service exposing Schwab market data REST APIs"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "requests>=2.31.0",
  "schwabdev>=4,<5",
  "uvicorn>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[tool.uv.build-backend]
module-name = "schwab_api"
