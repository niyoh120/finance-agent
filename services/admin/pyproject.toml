[project]
name = "admin"
version = "0.1.0"
description = "Admin for Finance MCP"
requires-python = ">=3.11"
dependencies = [
  "finance-shared",
  "python-dotenv>=1.0.0",
  "sqladmin[full]",
  "fastapi",
  "uvicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
finance-shared = { workspace = true }
