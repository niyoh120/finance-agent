[project]
name = "trade-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.12"
dependencies = [
    "agno>=2.4.3",
    "anthropic>=0.42.0",
    "ddgs>=9.10.0",
    "fastapi[standard]>=0.128.0",
    "finance-shared",
    "google-genai>=1.59.0",
    "httpx>=0.27.0",
    "matplotlib>=3.10.8",
    "mcp>=1.25.0",
    "numpy>=1.24.0",
    "openai>=2.15.0",
    "openinference-instrumentation-agno>=0.1.27",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14",
    "pillow>=12.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.1",
    "yfinance>=0.2.36",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
mcp-server = { workspace = true }
finance-shared = { workspace = true }
