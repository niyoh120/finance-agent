[project]
name = "wyckoff-agent"
version = "0.1.0"
description = "Wyckoff analysis agent (Chainlit + PydanticAI + Plotly)"
requires-python = ">=3.11"
dependencies = [
  "chainlit>=1.0.0",
  "plotly>=5.20.0",
  "kaleido>=0.2.1",
  "pandas>=2.0.0",
  "pydantic-ai>=0.0.49",
  "mcp",
  "httpx>=0.27.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
