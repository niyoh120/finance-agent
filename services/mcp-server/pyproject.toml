[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Options Flow"
requires-python = ">=3.11"
dependencies = [
  "finance-shared",
  "mcp",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
finance-shared = { workspace = true }
