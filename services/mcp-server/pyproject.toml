[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for Options Flow"
requires-python = ">=3.11"
dependencies = [
  "finance-shared",
  "httpx>=0.27.0",
  "mcp",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
finance-shared = { workspace = true }
