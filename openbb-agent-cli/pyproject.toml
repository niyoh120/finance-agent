[project]
name = "openbb-agent-cli"
version = "0.1.0"
description = "Agent-friendly JSON CLI for the OpenBB finance provider"
requires-python = ">=3.11"
dependencies = [
  "cyclopts>=4.0.0",
  "openbb-core>=1.4.0",
  "openbb-derivatives>=1.6.1",
  "openbb-econdb>=1.5.0",
  "openbb-economy>=1.6.1",
  "openbb-equity>=1.6.1",
  "openbb-etf>=1.6.1",
  "openbb-index>=1.6.1",
  "openbb-news>=1.6.1",
  "openbb-oecd>=1.6.0",
  "openbb-technical>=1.6.1",
  "openbb-finance",
  "tzdata>=2025.3",
]

[project.scripts]
openbb-agent-cli = "openbb_agent_cli.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
openbb-finance = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "openbb_agent_cli"
