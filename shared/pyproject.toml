[project]
name = "finance-shared"
version = "0.1.0"
description = "Shared models and database utilities for Finance MCP services"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
