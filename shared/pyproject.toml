[project]
name = "finance-shared"
version = "0.1.0"
description = "Shared models and database utilities for Finance MCP services"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "pydantic>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "structlog>=25.5.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "shared"
