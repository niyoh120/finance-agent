[tools]
python = "3.12"

[env]
_.file = ".env"

[tasks.install]
run = "uv sync --all-packages"

[tasks.news-scraper]
depends = ["install"]
run = "uv run python -m news_scraper.main"

[tasks.macro-scraper]
depends = ["install"]
run = "uv run python -m macro_scraper.main"

[tasks.options-scraper]
depends = ["install"]
run = "uv run python -m options_scraper.main"

[tasks.mcp-server]
depends = ["install"]
run = "uv run python -m mcp_server.http"

[tasks.wyckoff-agent]
depends = ["install"]
dir = "services/wyckoff-agent"
run = "uv run python -m chainlit run app.py -h"

[tasks.trade-agent]
depends = ["install"]
dir = "services/trade-agent"
run = "uv run python -m trade_agent.app"

[tasks.stock-api]
dir = "services/stock-api"
run = "npm run dev"

[tasks.docker-build-migrate]
run = "docker build -f migrate/Dockerfile -t {{vars.image_repo}}finance-migrate:latest -t {{vars.image_repo}}finance-migrate:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-macro-scraper]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=macro-scraper --build-arg MODULE_ENTRY=macro_scraper.main -t {{vars.image_repo}}finance-macro-scraper:latest -t {{vars.image_repo}}finance-macro-scraper:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-news-scraper]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=news-scraper --build-arg MODULE_ENTRY=news_scraper.main -t {{vars.image_repo}}finance-news-scraper:latest -t {{vars.image_repo}}finance-news-scraper:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-options-scraper]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=options-scraper --build-arg MODULE_ENTRY=options_scraper.main -t {{vars.image_repo}}finance-options-scraper:latest -t {{vars.image_repo}}finance-options-scraper:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-mcp-server]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=mcp-server --build-arg MODULE_ENTRY=mcp_server.http -t {{vars.image_repo}}finance-mcp-server:latest -t {{vars.image_repo}}finance-mcp-server:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-stock-api]
run = "docker build -f services/stock-api/Dockerfile -t {{vars.image_repo}}finance-stock-api:latest -t {{vars.image_repo}}finance-stock-api:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-all]
run = [
  { tasks = [
    "docker-build-migrate",
    "docker-build-macro-scraper",
    "docker-build-news-scraper",
    "docker-build-options-scraper",
    "docker-build-mcp-server",
    "docker-build-stock-api",
  ] },
]

[tasks.docker-push-migrate]
run = [
  "docker push {{vars.image_repo}}finance-migrate:latest",
  "docker push {{vars.image_repo}}finance-migrate:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-macro-scraper]
run = [
  "docker push {{vars.image_repo}}finance-macro-scraper:latest",
  "docker push {{vars.image_repo}}finance-macro-scraper:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-news-scraper]
run = [
  "docker push {{vars.image_repo}}finance-news-scraper:latest",
  "docker push {{vars.image_repo}}finance-news-scraper:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-options-scraper]
run = [
  "docker push {{vars.image_repo}}finance-options-scraper:latest",
  "docker push {{vars.image_repo}}finance-options-scraper:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-mcp-server]
run = [
  "docker push {{vars.image_repo}}finance-mcp-server:latest",
  "docker push {{vars.image_repo}}finance-mcp-server:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-stock-api]
run = [
  "docker push {{vars.image_repo}}finance-stock-api:latest",
  "docker push {{vars.image_repo}}finance-stock-api:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-all]
run = [
  { tasks = [
    "docker-push-migrate",
    "docker-push-macro-scraper",
    "docker-push-news-scraper",
    "docker-push-options-scraper",
    "docker-push-mcp-server",
    "docker-push-stock-api",
  ] },
]

[tasks.docker-build-push-migrate]
run = [
  { tasks = ["docker-build-migrate"] },
  { tasks = ["docker-push-migrate"] },
]

[tasks.docker-build-push-macro-scraper]
run = [
  { tasks = ["docker-build-macro-scraper"] },
  { tasks = ["docker-push-macro-scraper"] },
]

[tasks.docker-build-push-news-scraper]
run = [
  { tasks = ["docker-build-news-scraper"] },
  { tasks = ["docker-push-news-scraper"] },
]

[tasks.docker-build-push-options-scraper]
run = [
  { tasks = ["docker-build-options-scraper"] },
  { tasks = ["docker-push-options-scraper"] },
]

[tasks.docker-build-push-mcp-server]
run = [
  { tasks = ["docker-build-mcp-server"] },
  { tasks = ["docker-push-mcp-server"] },
]

[tasks.docker-build-push-stock-api]
run = [
  { tasks = ["docker-build-stock-api"] },
  { tasks = ["docker-push-stock-api"] },
]

[tasks.docker-build-push-all]
run = [
  { tasks = ["docker-build-all"] },
  { tasks = ["docker-push-all"] },
]

[tasks.db-upgrade]
depends = ["install"]
run = "uv run alembic upgrade head"

[tasks.db-downgrade]
depends = ["install"]
usage = '''
arg "<revision>" help="目标 revision（例如: -1, base, head^, <rev_id>）"
'''
run = "uv run alembic downgrade ${usage_revision?}"

[tasks.db-revision]
depends = ["install"]
usage = '''
arg "<message>" help="迁移描述"
'''
run = 'uv run alembic revision -m "${usage_message?}" --autogenerate'

[tasks.db-revision-manual]
depends = ["install"]
usage = '''
arg "<message>" help="迁移描述"
'''
run = 'uv run alembic revision -m "${usage_message?}"'

[tasks.db-current]
depends = ["install"]
run = "uv run alembic current"

[tasks.db-history]
depends = ["install"]
run = "uv run alembic history"

[vars]
image_repo = "docker.io/niyoh/"
