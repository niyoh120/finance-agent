[tools]
python = "3.12.12"
uv = "latest"

[env]
_.file = ".env"

[tasks.install]
run = "uv sync --all-packages"

[tasks.hooks-install]
run = "uvx pre-commit install --hook-type pre-commit --hook-type commit-msg"

[tasks.hooks-run]
depends = ["install"]
run = "uvx pre-commit run --all-files"

[tasks.options-scraper]
depends = ["install"]
run = "uv run python -m options_scraper.main"

[tasks.openbb-agent-cli]
depends = ["install"]
run = "uv run --package openbb-agent-cli openbb-agent-cli"

[tasks.docker-build-migrate]
run = "docker build -f migrate/Dockerfile -t {{vars.image_repo}}/finance-migrate:latest -t {{vars.image_repo}}/finance-migrate:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-options-scraper]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=options-scraper --build-arg MODULE_ENTRY=options_scraper.main -t {{vars.image_repo}}/finance-options-scraper:latest -t {{vars.image_repo}}/finance-options-scraper:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.schwab-api]
depends = ["install"]
run = "uv run --package schwab-api python -m schwab_api.main"

# openbb-finance 离线测试与检查：依赖 install 的全 workspace 安装，
# 保证跨包契约测试可以导入 tdx-api；实服务测试仅由显式环境变量门控。
[tasks.openbb-finance-test]
depends = ["install"]
run = "uv run --no-sync pytest openbb_finance/tests openbb-agent-cli/tests -q"

[tasks.openbb-finance-check]
depends = ["openbb-finance-test"]
run = [
  "uvx ruff@0.15.4 check openbb_finance/src/openbb_finance openbb_finance/tests",
  "uvx ruff@0.15.4 format --check openbb_finance/src/openbb_finance openbb_finance/tests",
]

# tdx-api：保持独立 frozen 环境（独立依赖闭包，与服务端解耦部署/验证）。
[tasks.tdx-api]
run = [
  "uv sync --frozen --package tdx-api",
  "uv run --no-sync python -m tdx_api.main",
]

[tasks.tdx-api-test]
run = [
  "uv sync --frozen --package tdx-api --group dev",
  "uv run --no-sync pytest services/tdx-api/tests -m 'not live'",
]

[tasks.tdx-api-check]
run = [
  { tasks = ["tdx-api-test"] },
  "uvx ruff@0.15.4 check services/tdx-api",
  "uvx ruff@0.15.4 format --check services/tdx-api",
]

[tasks.tdx-api-test-live]
# 显式启用 live 标记：对真实行情服务器的小规模连通性冒烟。
run = [
  "uv sync --frozen --package tdx-api --group dev",
  "uv run --no-sync pytest services/tdx-api/tests -m live",
]

[tasks.options-dashboard]
depends = ["install"]
run = "uv run --package options-dashboard streamlit run services/options-dashboard/app.py"

[tasks.docker-build-options-dashboard]
run = "docker build -f services/options-dashboard/Dockerfile -t {{vars.image_repo}}/finance-options-dashboard:latest -t {{vars.image_repo}}/finance-options-dashboard:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-schwab-api]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=schwab-api --build-arg MODULE_ENTRY=schwab_api.main -t {{vars.image_repo}}/finance-schwab-api:latest -t {{vars.image_repo}}/finance-schwab-api:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-tdx-api]
run = "docker build -f services/Dockerfile --build-arg MODULE_NAME=tdx-api --build-arg MODULE_ENTRY=tdx_api.main -t {{vars.image_repo}}/finance-tdx-api:latest -t {{vars.image_repo}}/finance-tdx-api:{{exec(command='git rev-parse --short HEAD')}} ."

[tasks.docker-build-all]
run = [
  { tasks = [
    "docker-build-migrate",
    "docker-build-options-dashboard",
    "docker-build-options-scraper",
    "docker-build-schwab-api",
    "docker-build-tdx-api",
  ] },
]

[tasks.docker-push-migrate]
run = [
  "docker push {{vars.image_repo}}/finance-migrate:latest",
  "docker push {{vars.image_repo}}/finance-migrate:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-options-scraper]
run = [
  "docker push {{vars.image_repo}}/finance-options-scraper:latest",
  "docker push {{vars.image_repo}}/finance-options-scraper:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-options-dashboard]
run = [
  "docker push {{vars.image_repo}}/finance-options-dashboard:latest",
  "docker push {{vars.image_repo}}/finance-options-dashboard:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-schwab-api]
run = [
  "docker push {{vars.image_repo}}/finance-schwab-api:latest",
  "docker push {{vars.image_repo}}/finance-schwab-api:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-tdx-api]
run = [
  "docker push {{vars.image_repo}}/finance-tdx-api:latest",
  "docker push {{vars.image_repo}}/finance-tdx-api:{{exec(command='git rev-parse --short HEAD')}}",
]

[tasks.docker-push-all]
run = [
  { tasks = [
    "docker-push-migrate",
    "docker-push-options-dashboard",
    "docker-push-options-scraper",
    "docker-push-schwab-api",
    "docker-push-tdx-api",
  ] },
]

[tasks.docker-build-push-migrate]
run = [
  { tasks = ["docker-build-migrate"] },
  { tasks = ["docker-push-migrate"] },
]

[tasks.docker-build-push-options-scraper]
run = [
  { tasks = ["docker-build-options-scraper"] },
  { tasks = ["docker-push-options-scraper"] },
]

[tasks.docker-build-push-options-dashboard]
run = [
  { tasks = ["docker-build-options-dashboard"] },
  { tasks = ["docker-push-options-dashboard"] },
]

[tasks.docker-build-push-schwab-api]
run = [
  { tasks = ["docker-build-schwab-api"] },
  { tasks = ["docker-push-schwab-api"] },
]

[tasks.docker-build-push-tdx-api]
run = [
  { tasks = ["docker-build-tdx-api"] },
  { tasks = ["docker-push-tdx-api"] },
]

[tasks.docker-build-push-all]
run = [
  { tasks = ["docker-build-all"] },
  { tasks = ["docker-push-all"] },
]

[tasks.db-upgrade]
depends = ["install"]
run = "uv run alembic upgrade head"

[tasks.db-downgrade]
depends = ["install"]
usage = '''
arg "<revision>" help="目标 revision（例如: -1, base, head^, <rev_id>）"
'''
run = "uv run alembic downgrade ${usage_revision?}"

[tasks.db-revision]
depends = ["install"]
usage = '''
arg "<message>" help="迁移描述"
'''
run = 'uv run alembic revision -m "${usage_message?}" --autogenerate'

[tasks.db-revision-manual]
depends = ["install"]
usage = '''
arg "<message>" help="迁移描述"
'''
run = 'uv run alembic revision -m "${usage_message?}"'

[tasks.db-current]
depends = ["install"]
run = "uv run alembic current"

[tasks.db-history]
depends = ["install"]
run = "uv run alembic history"

[vars]
image_repo = { required = "Set image_repo in mise.local.toml" }
