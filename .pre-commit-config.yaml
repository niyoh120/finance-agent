default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]
      - id: check-case-conflict
      - id: check-illegal-windows-names

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(shared|services|alembic)/.*\.py$
      - id: ruff-format
        files: ^(shared|services|alembic)/.*\.py$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          [
            build,
            chore,
            ci,
            docs,
            feat,
            fix,
            perf,
            refactor,
            revert,
            style,
            test,
          ]

  - repo: local
    hooks:
      - id: check-staged-paths-and-binary
        name: check staged paths and binary
        entry: python scripts/hooks/check_staged_paths_and_binary.py
        language: system

      - id: check-naming-policy
        name: check naming policy
        entry: python scripts/hooks/check_naming_policy.py
        language: system

      - id: python-compile-staged
        name: python compile staged files
        entry: python scripts/hooks/python_compile_staged.py
        language: system
        files: ^(shared|services|alembic)/.*\.py$

      - id: prettier-staged
        name: prettier staged files
        entry: scripts/hooks/prettier_staged.sh
        language: system
        files: \.(ts|tsx|js|mjs|cjs|json|ya?ml)$

      - id: eslint-staged
        name: eslint staged ts files
        entry: scripts/hooks/eslint_staged.sh
        language: system
        files: ^services/stock-api/.*\.(ts|tsx)$

      - id: ts-typecheck-if-needed
        name: ts typecheck if needed
        entry: scripts/hooks/ts_typecheck_if_needed.sh
        language: system
        pass_filenames: false
