name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      service:
        description: Select one service or all
        required: true
        type: choice
        default: all
        options:
          - all
          - migrate
          - macro-scraper
          - options-scraper
          - options-dashboard
      push:
        description: Push images to GHCR
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAMESPACE: ${{ github.repository_owner }}
      SHOULD_PUSH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.push == true || inputs.push == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: migrate
            image: finance-migrate
            dockerfile: migrate/Dockerfile
            build_args: ""
          - service: macro-scraper
            image: finance-macro-scraper
            dockerfile: services/Dockerfile
            build_args: |
              MODULE_NAME=macro-scraper
              MODULE_ENTRY=macro_scraper.main
          - service: options-scraper
            image: finance-options-scraper
            dockerfile: services/Dockerfile
            build_args: |
              MODULE_NAME=options-scraper
              MODULE_ENTRY=options_scraper.main
          - service: options-dashboard
            image: finance-options-dashboard
            dockerfile: services/options-dashboard/Dockerfile
            build_args: ""
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Login to GHCR
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service) && env.SHOULD_PUSH == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.service == 'all' || inputs.service == matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.SHOULD_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
