name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Ruff lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff check
        run: uvx ruff@0.15.4 check .

      - name: Ruff format check
        run: uvx ruff@0.15.4 format --check .

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run tests
        run: uv run pytest -q
