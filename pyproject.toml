[project]
name = "finance-workspace"
version = "0.0.0"
description = "Workspace root for Finance MCP microservices"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "python-dotenv>=1.0.0",
    "finance-shared",
]

[tool.uv.sources]
finance-shared = { workspace = true }

[tool.uv.workspace]
members = ["shared", "services/stock-scraper", "services/news-scraper"]
