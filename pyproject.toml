[project]
name = "finance-workspace"
version = "0.0.0"
description = "Workspace root for Finance MCP microservices"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "finance-shared",
  "openlit>=1.26.0",
  "setuptools<80",
  "sqlalchemy[asyncio]>=2.0.0",
]

[tool.uv.sources]
finance-shared = { workspace = true }

[tool.uv.workspace]
members = [
  "shared",
  "services/migrate",
  "services/macro-scraper",
  "services/bubbleseek-scraper",
  "services/futunn-scraper",
  "services/mcp-server",
  "services/trade-agent",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
