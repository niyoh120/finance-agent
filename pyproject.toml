[project]
name = "finance-workspace"
version = "0.0.0"
description = "Workspace root for finance services"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "finance-shared",
]

[tool.uv.sources]
finance-shared = { workspace = true }

[tool.uv.workspace]
members = [
  "shared",
  "services/macro-scraper",
  "services/options-scraper",
  "openbb-agent-cli",
  "openbb_finance",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.25.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
