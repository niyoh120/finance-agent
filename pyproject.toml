[project]
name = "finance-workspace"
version = "0.0.0"
description = "Workspace root for Finance MCP microservices"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "finance-shared",
  "python-dateutil>=2.9.0.post0",
  "sqlalchemy[asyncio]>=2.0.0",
]

[tool.uv.sources]
finance-shared = { workspace = true }

[tool.uv.workspace]
members = [
  "shared",
  "services/migrate",
  "services/macro-scraper",
  "services/news-scraper",
  "services/options-scraper",
  "services/mcp-server",
  "services/wyckoff-agent",
  "services/trade-agent",
]
