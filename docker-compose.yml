services:
    news-scraper:
        build:
            context: ./
            dockerfile: ./services/news-scraper/Dockerfile
        environment:
            - DATABASE_URL=${DATABASE_URL}
            - SCRAPE_INTERVAL=60
        restart: unless-stopped

        develop:
            watch:
                - action: rebuild
                  path: ./services/news-scraper/Dockerfile

