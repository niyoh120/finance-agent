services:
    news-scraper:
        build:
            context: ./
            dockerfile: ./services/Dockerfile
            args:
                MODULE_NAME: news-scraper
                MODULE_ENTRY: news_scraper.main
        environment:
            - FA_DATABASE_URL=${FA_DATABASE_URL}
            - FA_NEWS_SCRAPER_INTERVAL=60
        restart: unless-stopped

        develop:
            watch:
                - action: rebuild
                  path: ./services/Dockerfile

